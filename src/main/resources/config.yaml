# Пример конфигурации узла JBlockStorage
#
# Минимальная конфигурация — только сетевые параметры. Параметры, помеченные
# как "ОПЦИОНАЛЬНО", имеют разумные значения по умолчанию.

# ===== Сетевые параметры =====
# Порт TCP для входящих соединений. Если 0 — ОС выберет свободный.
listenPort: 8080

# Версия P2P-протокола. Узлы с разной версией не общаются.
protocolVersion: 1

# Список seed-узлов для bootstrap. Хотя бы один должен быть живым.
seedNodes:
  - 127.0.0.1:8081
  - 127.0.0.1:8082

# ОПЦИОНАЛЬНО — таймауты Keep-Alive (ТЗ п. 4.1.1.1.3).
# Дефолты: ping 10с, dead через 30с, gossip 15с.
pingIntervalSeconds: 10
peerTimeoutSeconds: 30
gossipIntervalSeconds: 15

# ОПЦИОНАЛЬНО — лимит пиров в таблице (защита от gossip-флуда).
maxPeers: 16

# ===== Параметры CLI / persistence (день 7) =====
# Путь к файлу зашифрованного приватного ключа. Создаётся командой
# `jblockstorage generate-keys --output=...`. Рядом должен лежать .pub.
keysFile: ./node.keys

# Пароль к keysFile. ВНИМАНИЕ: хранить в открытом виде в проде небезопасно;
# для учебной системы и быстрого старта — допустимо. Можно опустить и
# тогда CLI запросит интерактивно.
keysPassword: change-me-please

# Директория для локально хранимых шардов (наша роль хранителя).
shardsDir: ./data/shards

# Директория для RocksDB-блокчейна. Если её не указать — узел работает
# в режиме in-memory: блокчейн не переживает рестарт.
blockchainDir: ./data/blockchain
